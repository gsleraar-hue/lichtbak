# Builds Lichtbak and publishes a release for version tags.
#
# The Windows runner compiles with the C# compiler that ships with Windows itself
# (build.cmd), so there is nothing to install.
#
# Two ways to start it:
#   - by hand: Actions tab -> Build -> Run workflow (builds, keeps the files as artifacts)
#   - by pushing a version tag:  git tag v1.0.1 && git push origin v1.0.1

name: Build

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Tag matches the version in the code
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          grep -q "AssemblyVersion(\"$VERSION.0\")" src/AssemblyInfo.cs || { echo "src/AssemblyInfo.cs is not $VERSION"; exit 1; }

      - name: Build Lichtbak.exe
        shell: cmd
        run: build.cmd

      - name: Name the files after the version
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          [[ "$GITHUB_REF" == refs/tags/v* ]] || VERSION="dev"
          mkdir out
          cp bin/Lichtbak-setup.exe "out/Lichtbak-$VERSION-setup.exe"
          ls -la out

      - uses: actions/upload-artifact@v7
        with:
          name: lichtbak-windows
          path: out/*

  # Publishing is a separate job, so a release is only created once the build has succeeded.
  release:
    needs: [windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts

      - uses: softprops/action-gh-release@v3
        with:
          files: artifacts/**/*
          draft: false
          generate_release_notes: true
